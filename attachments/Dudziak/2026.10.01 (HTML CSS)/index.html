<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restauracja Marchewka</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>
    <header class="flex">
        <section class="left" id="left-head">
            <h1>Restauracja Marchewka</h1>
            <h3>Twoje wegetariańskie miejsce na mapie miasta</h3>
        </section>
        <section class="right" id="right-head">
            <img src="logo.png" alt="logo">
        </section>
    </header>
    <main class="flex">
        <section class="left" id="left-main">
            <h4>Twoja zamówienie</h4>
            <ul></ul>
            <button>Wyczyść</button>
            <button>Zatwierdź</button>
        </section>
        <section class="right flex" id="right-main">
            <div>
                <img src="nalesniki.webp" alt="Naleśniki">
                <p>Naleśniki</p>
            </div>
            <div>
                <img src="lasagne.webp" alt="Lasagne szpinakowa">
                <p>Lasagne szpinakowa</p>
            </div>
            <div>
                <img src="marchewka.webp" alt="Pieczona marchewka">
                <p>Pieczona marchewka</p>
            </div>
            <div>
                <img src="rosol.webp" alt="Wege rosół">
                <p>Wege rosół</p>
            </div>
            <div>
                <img src="tarta.webp" alt="Tarta szparagowa">
                <p>Tarta szparagowa</p>
            </div>
            <div>
                <img src="kompot.webp" alt="Kompot">
                <p>Kompot</p>
            </div>
        </section>
    </main>
    <footer>
        <p>Wykonał: 00000000000</p>
    </footer>
</body>
</html>
