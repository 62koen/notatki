<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon rowerowy</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>
    <header>
        <img src="pliki/1.jpg" alt="rower">
        <img src="pliki/2.jpg" alt="rower">
        <img src="pliki/3.jpg" alt="rower">
        <img src="pliki/4.jpg" alt="rower">
        <img src="pliki/5.jpg" alt="rower">
    </header>
    <div class="flex">
    <main>
        <h1>Dobierz rozmiar ramy roweru do wzrostu</h1>
        <h2>Wybierz rodzaj roweru</h2>
        <form>
        <input type="radio" name="rodzaj" id="r1" checked>
        <label for="r1" class="klasa_etykiety" title='górski z kołami 29"'>górski z kołami 29"</label>
        <input type="radio" name="rodzaj" id="r2">
        <label for="r2" class="klasa_etykiety" title="szosa">szosa</label>
        <input type="radio" name="rodzaj" id="r3">
        <label for="r3" class="klasa_etykiety" title="trekking">trekking</label>
        <h2>Podaj swój wzrost</h2>
        <input type="range" min="100" max="220" value="150" onchange="licznik()" id="wzrost">
        <input type="number" value="150" id="pole">
        <button class="klasa_etykiety">Sprawdź</button>
        </form>
    </main>
    <aside>
        <h1>Polecane firmy</h1>
        <p class="logo1 prawa">cup</p>
        <p class="logo2">glass</p>
        <p class="logo1 srodek">spoon</p>
        <p class="logo2 prawa">teaspoon</p>
        <p class="logo1">fork</p>
    </aside>
    </div>
    <div class="flex">
    <footer id="f1">
        <h4>Oferowane typy rowerów</h4>
        <ul>
            <li>górskie</li>
            <ul>
                <li>koła 29 cali</li>
                <li>koła 26 cali</li>
            </ul>
            <li>szosowe</li>
            <li>miejskie</li>
        </ul>
    </footer>
    <footer id="f2">
        <h4>Informacje</h4>
        <table>
            <tr>
                <td>Autor:</td>
                <td>Aktualna data:</td>
            </tr>
            <tr>
                <td>00000000000</td>
                <td>21.10.2026</td>
            </tr>
        </table>
    </footer>
    </div>
    <script>
        function licznik() {
            const wzrost = document.getElementById("wzrost").value;
            const pole = document.getElementById("pole");
            pole.value = wzrost;
        }
    </script>
</body>
</html>
