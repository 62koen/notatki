<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        main {
            height: 300px;
            width: 300px;
            border: 2px solid black;
            display: flex;
            flex-direction: column;
        }
        nav {
            background-color: aqua;
            width: 300px;
            height: 150px;
        }
        #smaller {
            height: 150px;
            width: 300px;
            display: flex;
        }
        #left {
            background-color: darkgoldenrod;
            width: 150px;
            height: 150px;
        }
        #right {
            background-color: green;
            width: 150px;
            height: 150px;
        }
    </style>
</head>
<body>
    <main>
        <nav></nav>
        <div id="smaller">
            <aside id="left"></aside>
            <aside id="right"></aside>
        </div>
    </main>
</body>
</html>
