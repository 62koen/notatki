<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #rel {
            position: relative;
            width: 300px;
            height: 300px;
            background-color: aqua;
        }
        #abs {
            position: absolute;
            height: 100px;
            width: 150px;
            background-color: brown;
            left: 150px;
            top: 200px;
        }
    </style>
</head>
<body>
    <div id="rel">
        relative
        <div id="abs">absolute</div>
    </div>
</body>
</html>
