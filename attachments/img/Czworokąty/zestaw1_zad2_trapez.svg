<svg width="100%" viewBox="0 0 680 230" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><mask id="imagine-text-gaps-qanpfy" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="230" fill="white"/><rect x="157.11111450195312" y="183.8333282470703" width="22.182406425476074" height="21.944442749023438" fill="black" rx="2"/><rect x="297.1111145019531" y="183.8333282470703" width="21.001851081848145" height="21.944442749023438" fill="black" rx="2"/><rect x="217.11111450195312" y="25.83333396911621" width="22.481480598449707" height="21.944442749023438" fill="black" rx="2"/><rect x="137.11111450195312" y="25.83333396911621" width="22.21388816833496" height="21.944442749023438" fill="black" rx="2"/><rect x="206.21852111816406" y="185.72222900390625" width="67.56295776367188" height="20.05555534362793" fill="black" rx="2"/><rect x="78.52314758300781" y="103.72222137451172" width="85.36573791503906" height="20.05555534362793" fill="black" rx="2"/><rect x="266.1111145019531" y="103.72222137451172" width="68.52314758300781" height="20.05555534362793" fill="black" rx="2"/><rect x="262.1111145019531" y="157.72222900390625" width="36.17592430114746" height="20.05555534362793" fill="black" rx="2"/><rect x="180.11111450195312" y="97.72222137451172" width="62.46296310424805" height="20.05555534362793" fill="black" rx="2"/><rect x="468.0263977050781" y="91.83333587646484" width="53.94721984863281" height="21.944442749023438" fill="black" rx="2"/><rect x="393.3129577636719" y="113.72222137451172" width="203.3740692138672" height="20.05555534362793" fill="black" rx="2"/></mask></defs>
<!-- Trapez prostokątny: A lewy dół, B prawy dół, C prawy góra, D lewy góra -->
<!-- kąt przy A = 90°, kąt przy B = 120° -->
<!-- A=(120,180) D=(120,60) — lewa pionowa krawędź (ramię prostokątne) -->
<!-- B=(270,180) C=? kąt przy B=120° → ramię BC idzie pod 60° od poziomej w górę-lewo -->
<!-- BC=4, więc C = (270 - 4*cos60, 180 - 4*sin60) = (270-2, 180-3.46) ≈ (268, 176.5) — za krótkie, skalujemy *20 dla czytelności -->
<!-- Skala: AB=3cm, skalujemy *40px/cm → AB=120px, BC=4cm→160px -->
<!-- A=(100,185) B=(220,185) kąt B=120°, ramię BC=160, C=(220-160*cos60,185-160*sin60)=(220-80,185-138.6)=(140,46) -->
<!-- D = A + (C-B) = (100+140-220,185+46-185) = (20,46) — zbyt blisko lewej, przesuwamy całość +80 -->
<!-- A=(180,185) B=(300,185) C=(220,46) D=(160,46) — sprawdzam -->
<polygon points="180,185 300,185 220,46 160,46" fill-opacity="0.12" stroke-width="1.5" style="fill:rgb(60, 52, 137);stroke:rgb(175, 169, 236);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<!-- kąt prosty przy A -->
<rect x="180" y="167" width="14" height="14" fill="none" stroke="var(--s)" stroke-width="1" style="fill:none;stroke:rgb(194, 192, 182);color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<!-- ramię AC — krótsza przekątna -->
<line x1="180" y1="185" x2="220" y2="46" stroke="#EF9F27" stroke-width="1.5" stroke-dasharray="6 3" mask="url(#imagine-text-gaps-qanpfy)" style="fill:rgb(0, 0, 0);stroke:rgb(239, 159, 39);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-dasharray:6px, 3px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<!-- Etykiety wierzchołków -->
<text x="163" y="200" style="fill:rgb(250, 249, 245);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;text-anchor:start;dominant-baseline:auto">A</text>
<text x="303" y="200" style="fill:rgb(250, 249, 245);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;text-anchor:start;dominant-baseline:auto">B</text>
<text x="223" y="42" style="fill:rgb(250, 249, 245);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;text-anchor:start;dominant-baseline:auto">C</text>
<text x="143" y="42" style="fill:rgb(250, 249, 245);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;text-anchor:start;dominant-baseline:auto">D</text>
<!-- Opisy boków -->
<text x="240" y="200" text-anchor="middle" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">AB = 3 cm</text>
<text x="158" y="118" text-anchor="end" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:end;dominant-baseline:auto">AD = ramię ⊥</text>
<text x="272" y="118" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">BC = 4 cm</text>
<!-- Kąt 120° przy B -->
<path d="M 278,185 A 22,22 0 0,0 290,165" fill="none" stroke="var(--s)" stroke-width="1" mask="url(#imagine-text-gaps-qanpfy)" style="fill:none;stroke:rgb(194, 192, 182);color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="268" y="172" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">120°</text>
<!-- Przekątna label -->
<text x="186" y="112" fill="#BA7517" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">AC = √37</text>
<!-- Wynik -->
<rect x="370" y="80" width="250" height="70" rx="8" fill-opacity="0.1" stroke-width="0.5" style="fill:rgb(60, 52, 137);stroke:rgb(175, 169, 236);color:rgb(251, 251, 254);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="495" y="108" text-anchor="middle" style="fill:rgb(250, 249, 245);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:auto">Wynik</text>
<text x="495" y="128" text-anchor="middle" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Krótsza przekątna = √37 ≈ 6,08 cm</text>
</svg>